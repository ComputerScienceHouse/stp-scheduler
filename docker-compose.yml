# From the repository root:
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:8000

name: stp-scheduler

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stp-scheduler
      # JWT signing key — replace in production (minimum 32 characters).
      AUTH_SECRET: "local-docker-dev-secret-change-before-production-use"
      AUTH_USERNAME: admin
      AUTH_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: stp-scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stp-scheduler"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: