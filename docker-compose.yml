# From the repository root:
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:8000

name: stp-scheduler

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
